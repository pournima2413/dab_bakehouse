# This is a Declarative Automation Bundle definition for bakehouse_analytics.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: bakehouse_analytics
  uuid: b46a65d6-075b-4880-9969-01c0a029fa75

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-6530d0c2-a9ab.cloud.databricks.com
    variables:
      catalog: bakehouse_analytics_dev
      schema: dev
  prod:
    mode: production
    workspace:
      host: https://dbc-6530d0c2-a9ab.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/pournima2413@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/pournima2413@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: bakehouse_analytics_dev
      schema: prod
    permissions:
      - user_name: pournima2413@gmail.com
        level: CAN_MANAGE
